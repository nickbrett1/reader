# reader ingestion pipeline — scheduled on the NAS by dagu.
#
# Steps mirror the CLI order:
#   manifest -> extract -> images -> chunk -> concepts -> embed -> index
#
# The `concepts` step runs an LLM (the typed-concept extraction pass); it is
# gated to DeepSeek's OFF-PEAK pricing window via a precondition, so the pass is
# billed at the half rate. See scripts/deepseek_offpeak.py for the window.
#
# Install: copy this file into the dagu DAGs directory on the NAS, then verify in
# the dagu UI (port 3006) or with `dagu status reader-pipeline`:
#   scp deploy/dagu/reader-pipeline.yaml <nas>:/volume1/docker/dagu/dags/
#
# reader runs as a long-lived *worker* container (`docker compose up -d`), so
# every step is executed inside it with `docker exec reader reader <step>`.
# The container must have READER_INGEST (the staging tree) and READER_DATA (the
# SQLite + LanceDB record) set, plus LITELLM_BASE_URL / LITELLM_MASTER_KEY.
#
# dagu therefore needs access to the Docker daemon (the docker socket, or to run
# on the NAS host). If dagu is itself a container, mount
# /var/run/docker.sock into it, or run the steps on the host instead.
#
# The off-peak precondition runs `scripts/deepseek_offpeak.py` *inside the
# reader container* (the runtime image ships the full source tree), so it does
# not depend on the dagu container having python3.

schedule: "30 10 * * *" # 10:30 UTC daily — outside both peak bands (01:00-04:00, 06:00-10:00)

steps:
  - name: manifest
    command: docker exec reader reader manifest --commit

  - name: extract
    command: docker exec reader reader extract

  - name: images
    command: docker exec reader reader images

  - name: chunk
    command: docker exec reader reader chunk

  # LLM pass: DeepSeek off-peak only. `deepseek-v4-flash` is the cheap model id
  # exposed by the gateway (verify with `curl /v1/models`); the step is deferred,
  # not failed, when the precondition says it is currently peak.
  - name: concepts
    command: docker exec reader reader concepts --llm-model deepseek-v4-flash
    preconditions:
      - condition: "docker exec reader python3 scripts/deepseek_offpeak.py"
        expected: "off-peak"

  # Quote selection: judgement-heavy, so the pro alias; also off-peak only.
  # It needs concepts to exist (the step above) and needs no vectors.
  - name: quotes
    command: docker exec reader reader quotes --llm-model deepseek-v4-pro
    preconditions:
      - condition: "docker exec reader python3 scripts/deepseek_offpeak.py"
        expected: "off-peak"

  - name: embed
    command: docker exec reader reader embed

  - name: index-optimize
    command: docker exec reader reader index --optimize
