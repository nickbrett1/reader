# Docker Compose configuration for reader
# Generated by genproj (docker-container capability), then adapted for a
# BATCH CLI (see deploy/README.md and reader-nas-deploy-brief.md).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# reader is NOT a server: it has no HTTP listener. This container is a *worker*
# that stays alive so the scheduled ingestion pipeline can run steps inside it
# (`docker exec reader reader <step>`), driven by dagu (port 3006). There is no
# published port and no Homepage widget, because there is no endpoint to serve
# or poll. The image reference uses your registry namespace (GitHub username/org
# for GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/reader:latest
    container_name: reader
    restart: unless-stopped

    # Keep the worker up; the default CMD (`python -m reader`) prints help and
    # exits, which would restart-loop under `restart: unless-stopped`.
    command: ["sleep", "infinity"]

    volumes:
      # Staging tree the pipeline reads (the real dir — was Books_ingest).
      - /volume1/homes/nick/Books:/ingest:ro
      # The served record: reader.db + index/ + images/ (seeded, see the brief).
      - /volume1/homes/nick/vg-books:/data
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://nas:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TURBOPUFFER_API_KEY: ${TURBOPUFFER_API_KEY}
      READER_INGEST: ${READER_INGEST:-/ingest}
      READER_DATA: ${READER_DATA:-/data}
    # If `nas` does not resolve on the bridge network, uncomment and set the IP:
    # extra_hosts:
    #   - "nas:192.168.1.x"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
